<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard IoT ESP32</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155'
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons & Chart.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- TOPBAR RESPONSIVA -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-md">
    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-xl border border-blue-500/20 shadow-inner">
          <i class="fa-solid fa-microchip text-2xl text-blue-500"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold tracking-wide">ESP32 IoT Monitor</h1>
          <p class="text-xs text-slate-400">Telemetría remota vía GitHub Pages</p>
        </div>
      </div>
    </div>

    <!-- Indicador de Estado y Tiempo -->
    <div class="flex items-center justify-between sm:justify-end gap-4 w-full sm:w-auto border-t sm:border-t-0 border-slate-800 pt-3 sm:pt-0">
      <div class="flex items-center gap-2 bg-slate-800/80 border border-slate-700/80 px-3 py-1.5 rounded-full text-xs">
        <span id="status-ping" class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <span id="status-text" class="text-slate-300 font-medium">Conectando...</span>
      </div>
      <div class="text-xs text-slate-400">
        Última lect.: <span id="last-update" class="text-slate-200 font-mono">--:--:--</span>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

    <!-- TARJETAS DE SENSORES (RESPONSIVAS: 1 col móvil, 3 col pc) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
      
      <!-- Card Temperatura -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-lg relative overflow-hidden backdrop-blur-sm">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Temperatura</p>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white mt-2"><span id="val-temp">--</span> <span class="text-lg text-rose-500 font-normal">°C</span></h2>
          </div>
          <div class="p-3 bg-rose-500/10 text-rose-500 rounded-xl border border-rose-500/20">
            <i class="fa-solid fa-temperature-high text-2xl"></i>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-700/40 flex justify-between items-center text-xs text-slate-400">
          <span>Sensor DHT/BME</span>
          <span id="state-temp" class="text-emerald-400 font-medium bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full">Normal</span>
        </div>
      </div>

      <!-- Card Humedad -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-lg relative overflow-hidden backdrop-blur-sm">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Humedad Relativa</p>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white mt-2"><span id="val-hum">--</span> <span class="text-lg text-cyan-500 font-normal">%</span></h2>
          </div>
          <div class="p-3 bg-cyan-500/10 text-cyan-400 rounded-xl border border-cyan-500/20">
            <i class="fa-solid fa-droplet text-2xl"></i>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-700/40 flex justify-between items-center text-xs text-slate-400">
          <span>Ambiente</span>
          <span id="state-hum" class="text-emerald-400 font-medium bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full">Óptimo</span>
        </div>
      </div>

      <!-- Card Voltaje -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-lg relative overflow-hidden backdrop-blur-sm sm:col-span-2 lg:col-span-1">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Voltaje Sistema</p>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white mt-2"><span id="val-volt">--</span> <span class="text-lg text-amber-500 font-normal">V</span></h2>
          </div>
          <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
            <i class="fa-solid fa-bolt text-2xl"></i>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-700/40 flex justify-between items-center text-xs text-slate-400">
          <span>Alimentación</span>
          <span id="state-volt" class="text-emerald-400 font-medium bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full">Estable</span>
        </div>
      </div>

    </div>

    <!-- SECCIÓN DE GRÁFICAS -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Gráfica 1: Temperatura y Humedad -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 sm:p-5 shadow-lg backdrop-blur-sm">
        <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-chart-line text-rose-400"></i> Histórico de Temperatura y Humedad
        </h3>
        <div class="relative h-64 sm:h-72 w-full">
          <canvas id="chartTempHum"></canvas>
        </div>
      </div>

      <!-- Gráfica 2: Voltaje -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 sm:p-5 shadow-lg backdrop-blur-sm">
        <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-wave-square text-amber-400"></i> Histórico de Voltaje
        </h3>
        <div class="relative h-64 sm:h-72 w-full">
          <canvas id="chartVoltaje"></canvas>
        </div>
      </div>

    </div>

  </main>

  <!-- LÓGICA DE COMUNICACIÓN CON GOOGLE APPS SCRIPT -->
  <script>
    // URL de tu implementación web
    const EXEC_URL = "https://script.google.com/macros/s/AKfycbwdEdJI_IkW8wWAih0DfJfqQ3XZcQr9zVt8lE3yVgpsDHlpyFkiQLzUQef2rNPsNGj-eQ/exec";
    const REFRESH_INTERVAL = 5000; // Actualización cada 5 segundos
    const MAX_DATA_POINTS = 10;     // Puntos máximos visibles en las gráficas

    // Referencias HTML
    const elTemp = document.getElementById("val-temp");
    const elHum = document.getElementById("val-hum");
    const elVolt = document.getElementById("val-volt");
    const elLastUpdate = document.getElementById("last-update");
    const elStatusPing = document.getElementById("status-ping");
    const elStatusText = document.getElementById("status-text");

    // Inicialización Chart.js: Temp & Hum
    const ctxTempHum = document.getElementById('chartTempHum').getContext('2d');
    const chartTempHum = new Chart(ctxTempHum, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Temperatura (°C)',
            borderColor: '#f43f5e',
            backgroundColor: 'rgba(244, 63, 94, 0.15)',
            data: [],
            borderWidth: 2,
            tension: 0.35,
            fill: true
          },
          {
            label: 'Humedad (%)',
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.15)',
            data: [],
            borderWidth: 2,
            tension: 0.35,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'sans-serif' } } } },
        scales: {
          x: { ticks: { color: '#64748b' }, grid: { color: '#334155' } },
          y: { ticks: { color: '#64748b' }, grid: { color: '#334155' } }
        }
      }
    });

    // Inicialización Chart.js: Voltaje
    const ctxVolt = document.getElementById('chartVoltaje').getContext('2d');
    const chartVolt = new Chart(ctxVolt, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Voltaje (V)',
          borderColor: '#f59e0b',
          backgroundColor: 'rgba(245, 158, 11, 0.15)',
          data: [],
          borderWidth: 2,
          tension: 0.35,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'sans-serif' } } } },
        scales: {
          x: { ticks: { color: '#64748b' }, grid: { color: '#334155' } },
          y: { ticks: { color: '#64748b' }, grid: { color: '#334155' } }
        }
      }
    });

    // Petición JSONP (Bypassea CORS al estar en GitHub Pages)
    function fetchSensorData() {
      const script = document.createElement('script');
      const callbackName = 'jsonp_' + Math.round(100000 * Math.random());
      
      // Callback global invocado por Google Apps Script
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) document.head.removeChild(script);
        actualizarDashboard(data);
      };

      // Manejo de errores de red
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) document.head.removeChild(script);
        setConnectionStatus(false);
      };

      // Agrega el parámetro callback a la URL de ejecución
      script.src = `${EXEC_URL}?callback=${callbackName}&_=${new Date().getTime()}`;
      document.head.appendChild(script);
    }

    // Procesamiento y renderizado de los datos recibidos
    function actualizarDashboard(data) {
      if (!data) return;

      if (data.fecha === "--") {
        elStatusText.textContent = "Esperando datos...";
        elStatusText.className = "text-amber-400 font-medium";
        return;
      }

      // 1. Actualización numérica en tarjetas
      elTemp.textContent = Number(data.temperatura).toFixed(1);
      elHum.textContent = Number(data.humedad).toFixed(1);
      elVolt.textContent = Number(data.voltaje).toFixed(2);
      elLastUpdate.textContent = data.fecha;

      setConnectionStatus(true);

      // 2. Extracción de hora para el eje X
      const timeLabel = data.fecha.includes(' ') ? data.fecha.split(' ')[1] : data.fecha;
      const lastLabel = chartTempHum.data.labels[chartTempHum.data.labels.length - 1];

      // 3. Evita duplicar el mismo punto de lectura en el gráfico
      if (lastLabel !== timeLabel) {
        chartTempHum.data.labels.push(timeLabel);
        chartVolt.data.labels.push(timeLabel);

        chartTempHum.data.datasets[0].data.push(data.temperatura);
        chartTempHum.data.datasets[1].data.push(data.humedad);
        chartVolt.data.datasets[0].data.push(data.voltaje);

        // Desplazamiento si supera el límite de puntos
        if (chartTempHum.data.labels.length > MAX_DATA_POINTS) {
          chartTempHum.data.labels.shift();
          chartTempHum.data.datasets[0].data.shift();
          chartTempHum.data.datasets[1].data.shift();

          chartVolt.data.labels.shift();
          chartVolt.data.datasets[0].data.shift();
        }

        chartTempHum.update();
        chartVolt.update();
      }
    }

    function setConnectionStatus(isOnline) {
      if (isOnline) {
        elStatusPing.className = "relative flex h-3 w-3";
        elStatusPing.innerHTML = `
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        `;
        elStatusText.textContent = "Conectado";
        elStatusText.className = "text-emerald-400 font-medium";
      } else {
        elStatusPing.className = "relative flex h-3 w-3 bg-rose-500 rounded-full";
        elStatusPing.innerHTML = '';
        elStatusText.textContent = "Error de Conexión";
        elStatusText.className = "text-rose-400 font-medium";
      }
    }

    // Iniciar ciclo de refresco automático
    fetchSensorData();
    setInterval(fetchSensorData, REFRESH_INTERVAL);
  </script>
</body>
</html>
