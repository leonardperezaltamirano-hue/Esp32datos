<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard IoT ESP32</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { bg: '#0f172a', card: '#1e293b', border: '#334155' } }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <!-- HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-md">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-xl border border-blue-500/20">
        <i class="fa-solid fa-microchip text-2xl text-blue-500"></i>
      </div>
      <div>
        <h1 class="text-lg sm:text-xl font-bold tracking-wide">ESP32 IoT Monitor</h1>
        <p class="text-xs text-slate-400">Telemetría y Control de Sensores</p>
      </div>
    </div>

    <!-- Filtros de tiempo -->
    <div class="flex flex-wrap items-center justify-between sm:justify-end gap-3 w-full sm:w-auto">
      <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 p-1 rounded-xl text-xs">
        <button onclick="changeTimeRange('realtime')" id="btn-realtime" class="time-btn px-2.5 py-1 rounded-lg transition-colors font-medium text-slate-400 hover:text-white">Realtime</button>
        <button onclick="changeTimeRange('1h')" id="btn-1h" class="time-btn px-2.5 py-1 rounded-lg transition-colors font-medium text-slate-400 hover:text-white">1 Hora</button>
        <button onclick="changeTimeRange('12h')" id="btn-12h" class="time-btn px-2.5 py-1 rounded-lg transition-colors font-medium text-slate-400 hover:text-white">12 Horas</button>
        <button onclick="changeTimeRange('1d')" id="btn-1d" class="time-btn px-2.5 py-1 rounded-lg transition-colors font-medium text-slate-400 hover:text-white">1 Día</button>
        <button onclick="changeTimeRange('1w')" id="btn-1w" class="time-btn px-2.5 py-1 rounded-lg transition-colors font-medium text-slate-400 hover:text-white">1 Semana</button>
      </div>

      <div class="flex items-center gap-2 bg-slate-800/80 border border-slate-700/80 px-3 py-1.5 rounded-full text-xs">
        <span id="status-ping" class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
        </span>
        <span id="status-text" class="text-amber-400 font-medium">Conectando...</span>
      </div>
    </div>
  </header>

  <!-- TARJETAS Y TRES GRÁFICAS INDEPENDIENTES -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

    <!-- Tarjetas de métricas rápidas -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-lg">
        <p class="text-xs font-semibold text-slate-400 uppercase">Temperatura</p>
        <h2 class="text-3xl font-extrabold text-white mt-2"><span id="val-temp">--</span> <span class="text-lg text-rose-500">°C</span></h2>
        <p class="text-xs text-slate-400 mt-3">Última lect.: <span id="last-update" class="text-slate-200 font-mono">--:--:--</span></p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-lg">
        <p class="text-xs font-semibold text-slate-400 uppercase">Humedad</p>
        <h2 class="text-3xl font-extrabold text-white mt-2"><span id="val-hum">--</span> <span class="text-lg text-cyan-500">%</span></h2>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-lg">
        <p class="text-xs font-semibold text-slate-400 uppercase">Voltaje</p>
        <h2 class="text-3xl font-extrabold text-white mt-2"><span id="val-volt">--</span> <span class="text-lg text-amber-500">V</span></h2>
      </div>
    </div>

    <!-- Gráficas independientes -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Gráfica Temperatura -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 shadow-lg">
        <div class="flex justify-between mb-4">
          <h3 class="text-sm font-semibold text-slate-300"><i class="fa-solid fa-temperature-high text-rose-400"></i> Temperatura</h3>
          <span class="text-xs text-slate-400 font-mono" id="label-range-temp">REALTIME</span>
        </div>
        <div class="relative h-60 w-full"><canvas id="chartTemperatura"></canvas></div>
      </div>

      <!-- Gráfica Humedad -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 shadow-lg">
        <div class="flex justify-between mb-4">
          <h3 class="text-sm font-semibold text-slate-300"><i class="fa-solid fa-droplet text-cyan-400"></i> Humedad</h3>
          <span class="text-xs text-slate-400 font-mono" id="label-range-hum">REALTIME</span>
        </div>
        <div class="relative h-60 w-full"><canvas id="chartHumedad"></canvas></div>
      </div>

      <!-- Gráfica Voltaje -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 shadow-lg">
        <div class="flex justify-between mb-4">
          <h3 class="text-sm font-semibold text-slate-300"><i class="fa-solid fa-bolt text-amber-400"></i> Voltaje</h3>
          <span class="text-xs text-slate-400 font-mono" id="label-range-volt">REALTIME</span>
        </div>
        <div class="relative h-60 w-full"><canvas id="chartVoltaje"></canvas></div>
      </div>

    </div>
  </main>

  <script>
    const EXEC_URL = "https://script.google.com/macros/s/AKfycbw93kQEr_CzZ_Q6gPIGzUUEK5TpXPzNfaQOl7p7yYh4xXpyYfEPvTqt4b0yjH4m24Wy-A/exec";
    
    // TIEMPOS DE REFRESCO ÓPTIMOS SEGÚN EL FILTRO (Milisegundos)
    const REFRESH_RANGES = {
      realtime: 5000,  // 5 segundos (Tiempo Real)
      '1h': 15000,     // 15 segundos
      '12h': 30000,    // 30 segundos
      '1d': 60000,     // 1 minuto
      '1w': 120000     // 2 minutos
    };

    let isFetching = false;
    let currentRange = "realtime";
    let timerId = null;

    function createChartConfig(color, bgColor) {
      return {
        type: 'line',
        data: { labels: [], datasets: [{ borderColor: color, backgroundColor: bgColor, data: [], borderWidth: 2, tension: 0.2, pointRadius: 2, fill: true }] },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false } },
          scales: { x: { ticks: { color: '#64748b', maxTicksLimit: 6 }, grid: { color: '#334155' } }, y: { ticks: { color: '#64748b' }, grid: { color: '#334155' } } }
        }
      };
    }

    const chartTemp = new Chart(document.getElementById('chartTemperatura'), createChartConfig('#f43f5e', 'rgba(244, 63, 94, 0.1)'));
    const chartHum = new Chart(document.getElementById('chartHumedad'), createChartConfig('#06b6d4', 'rgba(6, 182, 212, 0.1)'));
    const chartVolt = new Chart(document.getElementById('chartVoltaje'), createChartConfig('#f59e0b', 'rgba(245, 158, 11, 0.1)'));

    function changeTimeRange(range) {
      currentRange = range;
      document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('bg-blue-600', 'text-white'));
      document.getElementById(`btn-${range}`)?.classList.add('bg-blue-600', 'text-white');
      
      ['temp', 'hum', 'volt'].forEach(id => {
        const el = document.getElementById(`label-range-${id}`);
        if(el) el.textContent = range.toUpperCase();
      });

      // Reiniciar temporizador adaptativo según el rango seleccionado
      if (timerId) clearInterval(timerId);
      fetchSensorData();
      timerId = setInterval(fetchSensorData, REFRESH_RANGES[currentRange] || 5000);
    }

    function fetchSensorData() {
      if (isFetching) return;
      isFetching = true;

      const callbackName = 'handleScriptResponse_' + Math.floor(Math.random() * 100000);
      
      window[callbackName] = function(resData) {
        procesarRespuesta(resData);
        cleanup();
      };

      const script = document.createElement('script');
      script.src = `${EXEC_URL}?range=${currentRange}&callback=${callbackName}&_=${Date.now()}`;
      
      script.onerror = function() {
        setConnectionStatus(false);
        cleanup();
      };

      function cleanup() {
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[callbackName];
        isFetching = false;
      }

      document.body.appendChild(script);
    }

    function procesarRespuesta(resData) {
      if (!resData) {
        setConnectionStatus(false);
        return;
      }

      setConnectionStatus(true);

      if (Array.isArray(resData)) {
        renderHistorico(resData);
      } else if (resData && typeof resData === 'object') {
        actualizarRealtime(resData);
      }
    }

    // Limpia y normaliza números que vienen con coma o nulos
    function parsearValor(val) {
      if (val === undefined || val === null || val === '') return 0;
      let num = parseFloat(String(val).replace(',', '.'));
      return isNaN(num) ? 0 : num;
    }

    // Normaliza cualquier formato de fecha (ISO, timestamp o HH:mm:ss)
    function parsearFecha(fechaStr) {
      if (!fechaStr) return '--';
      let str = String(fechaStr);
      if (str.includes('T')) {
        let parts = str.split('T');
        let time = parts[1].substring(0, 8);
        return time;
      }
      return str.includes(' ') ? str.split(' ')[1] : str;
    }

    function actualizarRealtime(data) {
      if (!data || data.fecha === "--" || data.fecha === "Error") return;

      const t = parsearValor(data.temperatura);
      const h = parsearValor(data.humedad);
      const v = parsearValor(data.voltaje);
      const f = parsearFecha(data.fecha);

      document.getElementById("val-temp").textContent = t.toFixed(1);
      document.getElementById("val-hum").textContent = h.toFixed(1);
      document.getElementById("val-volt").textContent = v.toFixed(2);
      document.getElementById("last-update").textContent = f;

      [chartTemp, chartHum, chartVolt].forEach((chart, idx) => {
        const val = [t, h, v][idx];
        const lastLabel = chart.data.labels[chart.data.labels.length - 1];

        if (lastLabel !== f) {
          chart.data.labels.push(f);
          chart.data.datasets[0].data.push(val);
          if (chart.data.labels.length > 20) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
          }
          chart.update('none');
        }
      });
    }

    function renderHistorico(dataArray) {
      if (!dataArray || dataArray.length === 0) return;

      const ultimo = dataArray[dataArray.length - 1];
      const tUlt = parsearValor(ultimo.temperatura);
      const hUlt = parsearValor(ultimo.humedad);
      const vUlt = parsearValor(ultimo.voltaje);
      const fUlt = parsearFecha(ultimo.fecha);

      document.getElementById("val-temp").textContent = tUlt.toFixed(1);
      document.getElementById("val-hum").textContent = hUlt.toFixed(1);
      document.getElementById("val-volt").textContent = vUlt.toFixed(2);
      document.getElementById("last-update").textContent = fUlt;

      const labels = [];
      const tempVals = [];
      const humVals = [];
      const voltVals = [];

      dataArray.forEach(item => {
        labels.push(parsearFecha(item.fecha));
        tempVals.push(parsearValor(item.temperatura));
        humVals.push(parsearValor(item.humedad));
        voltVals.push(parsearValor(item.voltaje));
      });

      chartTemp.data.labels = labels; 
      chartTemp.data.datasets[0].data = tempVals; 
      chartTemp.update('none');

      chartHum.data.labels = labels; 
      chartHum.data.datasets[0].data = humVals; 
      chartHum.update('none');

      chartVolt.data.labels = labels; 
      chartVolt.data.datasets[0].data = voltVals; 
      chartVolt.update('none');
    }

    function setConnectionStatus(isOnline) {
      const pingEl = document.getElementById("status-ping");
      const textEl = document.getElementById("status-text");
      
      if (isOnline) {
        pingEl.className = "relative flex h-3 w-3";
        pingEl.innerHTML = `
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        `;
        textEl.textContent = "Conectado";
        textEl.className = "text-emerald-400 font-medium";
      } else {
        pingEl.className = "relative flex h-3 w-3 bg-rose-500 rounded-full";
        pingEl.innerHTML = '';
        textEl.textContent = "Error de Red";
        textEl.className = "text-rose-400 font-medium";
      }
    }

    // Inicializar vista Realtime
    changeTimeRange('realtime');
  </script>
</body>
</html>
